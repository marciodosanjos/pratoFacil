spring.application.name=PratoFacil

# Porta: usa a variavel PORT (definida pela hospedagem, ex.: Render) ou 8080 localmente.
server.port=${PORT:8080}

# Forca UTF-8 nas requisicoes/respostas (corrige acentos em formularios POST)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Perfil ativo por padrao: 'dev' (banco H2 local). Em producao, sobrescreva com
# a variavel de ambiente SPRING_PROFILES_ACTIVE=prod (ou --spring.profiles.active=prod).
spring.profiles.active=dev

# JPA / Hibernate (comum a todos os perfis)
spring.jpa.hibernate.ddl-auto=update
# Mantido habilitado: as paginas Thymeleaf acessam colecoes lazy (pedido.cardapios)
# durante a renderizacao. Definido explicitamente para silenciar o warning do Spring.
spring.jpa.open-in-view=true

# Respostas de erro da API mais limpas (sem stacktrace, com mensagem)
server.error.include-message=always
server.error.include-stacktrace=never

# Documentacao da API: Swagger UI em /swagger-ui.html e contrato OpenAPI em /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Upload da logo da loja (imagem)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Asaas (pagamentos). A chave vem da variavel de ambiente ASAAS_API_KEY.
# Sem a chave, a integracao fica desligada (o app funciona normalmente, sem cobranca).
asaas.base-url=${ASAAS_BASE_URL:https://sandbox.asaas.com/api/v3}
asaas.api-key=${ASAAS_API_KEY:}
# Token do webhook (opcional): se definido, o endpoint /webhooks/asaas so aceita
# chamadas que enviem este token no header 'asaas-access-token'. Deve ser igual
# ao "Token de autenticacao" cadastrado no painel de webhooks do Asaas.
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
