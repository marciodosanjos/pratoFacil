# ==========================================================================
# Perfil DEV (padrao): banco H2 em memoria. Os dados sao reiniciados a cada
# execucao. Console web do H2 disponivel em http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:cardapiofacildb, usuario: sa, senha em branco).
# ==========================================================================
spring.datasource.url=jdbc:h2:mem:cardapiofacildb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
