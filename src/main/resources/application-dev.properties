# ==========================================================================
# Perfil DEV (padrao): banco H2 em ARQUIVO, gravado em ./data/pratofacildb.
# Assim os dados (lojas, pedidos, perfis) PERSISTEM entre reinicios do servidor.
# Console web do H2 em http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:file:./data/pratofacildb   usuario: sa   senha: (em branco)
# Para "zerar" o banco de dev, basta apagar a pasta ./data
# ==========================================================================
spring.datasource.url=jdbc:h2:file:./data/pratofacildb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
