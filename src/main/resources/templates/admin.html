<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Cardápio</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #faf6f0; color: #3e322d; padding: 40px 20px; max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px dashed #cda45e; padding-bottom: 20px; }
        h1 { color: #0c0b09; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        .table-container { background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e1d6c6; }
        th { background-color: #0c0b09; color: #cda45e; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        tr:hover { background-color: #fcfaf7; }

        /* Container de botões em linha */
        .actions-group { display: flex; gap: 8px; align-items: center; }

        /* Botão Editar */
        .btn-editar { display: inline-block; padding: 6px 12px; background-color: #cda45e; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 13px; transition: background 0.3s; }
        .btn-editar:hover { background-color: #b89252; }

        /* Botão Excluir */
        .btn-excluir { background-color: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; transition: background 0.3s; }
        .btn-excluir:hover { background-color: #c9302c; }

        .price { font-weight: bold; color: #0c0b09; }
    </style>
</head>
<body>

<div class="header">
    <h1>Gerenciar Itens do Cardápio</h1>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th style="width: 8%;">ID</th>
            <th style="width: 25%;">Nome</th>
            <th style="width: 37%;">Descrição</th>
            <th style="width: 15%;">Preço</th>
            <th style="width: 15%;">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${itens}">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.nome}" style="font-weight: 500;">Nome do Prato</td>
            <td th:text="${item.descricao}" style="color: #7a6a60; font-size: 14px;">Descrição do prato...</td>
            <td class="price" th:text="${item.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(item.preco, 1, 'POINT', 2, 'COMMA')} : 'R$ 0,00'">R$ 0,00</td>
            <td>
                <div class="actions-group">
                    <a th:href="@{/admin/pratos/editar/{id}(id=${item.id})}" class="btn-editar">Editar</a>

                    <form th:action="@{/admin/pratos/deletar/{id}(id=${item.id})}" method="POST"
                          onsubmit="return confirm('Tem certeza que deseja excluir este prato permanentemente?');" style="margin: 0;">
                        <button type="submit" class="btn-excluir">Excluir</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
