<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - PratoFácil</title>
    <style>
        :root { --gold:#cda45e; --cream:#faf6f0; --dark:#0c0b09; --muted:#7a6a60; }
        * { box-sizing:border-box; }
        body { font-family:'Helvetica Neue',Arial,sans-serif; color:#3e322d; background:var(--cream); margin:0 auto; padding:40px 20px 110px; max-width:800px; }
        .header { text-align:center; border-bottom:2px dashed var(--gold); padding-bottom:20px; margin-bottom:20px; }
        .header h1 { color:var(--dark); font-size:28px; margin:0 0 10px; text-transform:uppercase; letter-spacing:2px; }
        .header p { color:var(--gold); font-style:italic; margin:0; }
        .voltar { display:inline-block; margin-bottom:18px; color:var(--gold); text-decoration:none; font-weight:bold; font-size:14px; }
        .aviso { background:#fff9e6; color:#b89252; border:1px solid #ffe8b3; padding:12px 16px; border-radius:6px; text-align:center; margin-bottom:20px; font-size:14px; }
        .section-title { color:var(--dark); font-size:18px; border-left:4px solid var(--gold); padding-left:12px; margin:26px 0 14px; text-transform:uppercase; letter-spacing:1px; }
        .item { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid #e1d6c6; }
        .item-info { flex:1; }
        .item-info h3 { margin:0 0 5px; font-size:17px; color:var(--dark); }
        .item-info p { margin:0; font-size:13px; color:var(--muted); }
        .item-right { text-align:right; white-space:nowrap; }
        .price { display:block; font-weight:bold; color:var(--gold); font-size:16px; margin-bottom:8px; }
        .stepper { display:inline-flex; align-items:center; gap:10px; }
        .stepper button { width:32px; height:32px; border:1px solid var(--gold); background:#fff; color:var(--gold); border-radius:50%; font-size:18px; font-weight:bold; cursor:pointer; line-height:1; }
        .stepper button:hover { background:var(--gold); color:#fff; }
        .stepper .qty { min-width:20px; text-align:center; font-weight:bold; font-size:16px; color:var(--dark); }
        .no-items { text-align:center; padding:30px; color:var(--muted); font-style:italic; border:1px dashed #e1d6c6; background:#fcfaf7; border-radius:4px; }
        .cartbar {
            position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e1d6c6;
            box-shadow:0 -3px 14px rgba(0,0,0,0.08); padding:14px 20px;
            display:flex; justify-content:space-between; align-items:center; gap:14px;
        }
        .cartbar .cart-info { display:flex; flex-direction:column; line-height:1.3; }
        .cartbar #cart-count { font-size:13px; color:var(--muted); }
        .cartbar #cart-total { font-size:20px; color:var(--dark); }
        .cartbar button { padding:13px 22px; background:var(--gold); color:#fff; border:none; border-radius:6px; font-size:15px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; cursor:pointer; }
        .cartbar button:disabled { background:#d8cbb6; cursor:not-allowed; }
        .cartbar button:not(:disabled):hover { background:#b89252; }
    </style>
</head>
<body>

<div class="header">
    <img th:if="${loja != null}" th:src="@{'/lojas/' + ${loja.id} + '/logo'}" alt="logo"
         style="width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #cda45e;margin-bottom:10px;"
         onerror="this.style.display='none'">
    <h1 th:text="${loja != null} ? ${loja.nome} : 'Cardápio'">Cardápio</h1>
    <p th:text="${loja != null and loja.descricao != null and !loja.descricao.isEmpty()} ? ${loja.descricao} : 'Monte o seu pedido'">Monte o seu pedido</p>
</div>

<a th:href="@{/lojas}" class="voltar">← Ver outras lojas</a>

<div class="aviso" th:if="${param.vazio}">Selecione ao menos um item (use o + para adicionar).</div>

<div class="no-items" th:if="${pratos == null or pratos.isEmpty()}">
    Nenhum prato disponível nesta loja no momento.
</div>

<form th:action="@{/novo-pedido}" method="post" th:if="${pratos != null and !pratos.isEmpty()}">

    <input type="hidden" name="lojaId" th:if="${loja != null}" th:value="${loja.id}">

    <div th:each="c, iter : ${pratos}">
        <div class="section-title"
             th:if="${iter.index == 0 or pratos[iter.index - 1].categoria != c.categoria}"
             th:text="${c.categoria != null ? c.categoria.descricao : 'Outros'}">Categoria</div>

        <div class="item" th:attr="data-preco=${c.preco}">
            <div class="item-info">
                <h3 th:text="${c.nome}">Nome do prato</h3>
                <p th:text="${c.descricao}">Descrição</p>
            </div>
            <div class="item-right">
                <span class="price" th:text="${c.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(c.preco,1,'POINT',2,'COMMA')} : 'R$ 0,00'">R$ 0,00</span>
                <input type="hidden" th:name="|itens[${iter.index}].cardapioId|" th:value="${c.id}">
                <input type="hidden" th:name="|itens[${iter.index}].quantidade|" value="0" class="qtd">
                <div class="stepper">
                    <button type="button" onclick="alterar(this,-1)">−</button>
                    <span class="qty">0</span>
                    <button type="button" onclick="alterar(this,1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="cartbar">
        <div class="cart-info">
            <span id="cart-count">Carrinho vazio</span>
            <strong id="cart-total">R$ 0,00</strong>
        </div>
        <button type="submit" id="cart-btn" disabled>Finalizar pedido</button>
    </div>
</form>

<script>
    function alterar(btn, delta) {
        const item = btn.closest('.item');
        const campoQtd = item.querySelector('.qtd');
        let q = (parseInt(campoQtd.value, 10) || 0) + delta;
        if (q < 0) { q = 0; }
        campoQtd.value = q;
        item.querySelector('.qty').textContent = q;
        render();
    }

    function render() {
        let count = 0, total = 0;
        document.querySelectorAll('.item').forEach(function (item) {
            const q = parseInt(item.querySelector('.qtd').value, 10) || 0;
            const preco = parseFloat(item.dataset.preco) || 0;
            count += q;
            total += q * preco;
        });
        document.getElementById('cart-count').textContent =
            count === 0 ? 'Carrinho vazio' : (count === 1 ? '1 item' : count + ' itens');
        document.getElementById('cart-total').textContent =
            'R$ ' + total.toFixed(2).replace('.', ',');
        document.getElementById('cart-btn').disabled = count === 0;
    }

    render();
</script>

</body>
</html>
