<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - PratoFácil</title>
    <style>
        :root { --gold:#cda45e; --cream:#faf6f0; --dark:#0c0b09; --muted:#7a6a60; }
        * { box-sizing:border-box; }
        body { font-family:'Helvetica Neue',Arial,sans-serif; color:#3e322d; background:var(--cream); margin:0 auto; padding:40px 20px; max-width:520px; }
        .header { text-align:center; border-bottom:2px dashed var(--gold); padding-bottom:18px; margin-bottom:24px; }
        .header h1 { color:var(--dark); font-size:26px; margin:0; text-transform:uppercase; letter-spacing:2px; }
        .card { background:#fff; border:1px solid #e1d6c6; border-radius:10px; padding:30px 26px; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
        label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; }
        input { width:100%; padding:12px; margin-bottom:18px; border:1px solid #e1d6c6; border-radius:6px; font-size:15px; background:#fcfaf7; }
        input:focus { outline:none; border-color:var(--gold); }
        input[readonly] { background:#f0ece4; color:var(--muted); }
        .hint { font-size:12px; color:var(--muted); margin:-12px 0 18px; }
        .btn { width:100%; padding:13px; border:none; border-radius:6px; background:var(--gold); color:#fff; font-size:15px; font-weight:bold; text-transform:uppercase; letter-spacing:1px; cursor:pointer; }
        .btn:hover { background:#b89252; }
        .msg { padding:11px 14px; border-radius:6px; font-size:14px; margin-bottom:18px; text-align:center; }
        .msg-ok { background:#e6f9ed; color:#1e7e34; border:1px solid #b3f0c2; }
        .msg-erro { background:#fdecea; color:#b3261e; border:1px solid #f3c2bd; }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: clienteNav}"></div>

<div class="header">
    <h1>Meu Perfil</h1>
</div>

<div class="msg msg-ok" th:if="${param.ok}">Perfil atualizado com sucesso.</div>
<div class="msg msg-erro" th:if="${param.erro}">Não foi possível salvar. Verifique os dados.</div>

<div class="card">
    <form th:action="@{/perfil}" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" th:value="${usuario.nome}" required>

        <label for="email">E-mail (login)</label>
        <input type="email" id="email" th:value="${usuario.email}" readonly>
        <div class="hint">O e-mail é o seu login e não pode ser alterado aqui.</div>

        <label for="senha">Nova senha</label>
        <input type="password" id="senha" name="senha" placeholder="deixe em branco para manter a atual" minlength="4">
        <div class="hint">Preencha apenas se quiser trocar a senha (mínimo 4 caracteres).</div>

        <button type="submit" class="btn">Salvar alterações</button>
    </form>
</div>

</body>
</html>
