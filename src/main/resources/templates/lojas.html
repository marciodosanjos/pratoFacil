<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojas - PratoFácil</title>
    <style>
        :root { --gold:#cda45e; --cream:#faf6f0; --dark:#0c0b09; --muted:#7a6a60; }
        * { box-sizing:border-box; }
        body { font-family:'Helvetica Neue',Arial,sans-serif; color:#3e322d; background:var(--cream); margin:0 auto; padding:40px 20px; max-width:900px; }
        .header { text-align:center; border-bottom:2px dashed var(--gold); padding-bottom:20px; margin-bottom:30px; }
        .header h1 { color:var(--dark); font-size:30px; margin:0 0 8px; text-transform:uppercase; letter-spacing:2px; }
        .header p { color:var(--gold); font-style:italic; margin:0; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:22px; }
        .loja-card {
            background:#fff; border:1px solid #e1d6c6; border-radius:10px; padding:28px 22px;
            text-align:center; text-decoration:none; color:inherit; box-shadow:0 4px 15px rgba(0,0,0,0.05);
            transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            display:flex; flex-direction:column; align-items:center; justify-content:space-between;
        }
        .loja-card:hover { transform:translateY(-5px); box-shadow:0 8px 25px rgba(205,164,94,0.2); border-color:var(--gold); }
        .loja-icon { font-size:42px; margin-bottom:14px; }
        .loja-logo { width:110px; height:110px; border-radius:50%; object-fit:cover; margin-bottom:14px; border:3px solid #e1d6c6; }
        .loja-card h2 { color:var(--dark); font-size:20px; margin:0 0 8px; }
        .loja-card p { color:var(--muted); font-size:14px; margin:0 0 18px; line-height:1.5; }
        .btn { display:inline-block; padding:9px 18px; background:var(--gold); color:#fff; border-radius:4px; font-size:13px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; }
        .loja-card:hover .btn { background:var(--dark); color:var(--gold); }
        .empty { text-align:center; padding:40px; color:var(--muted); font-style:italic; border:1px dashed #e1d6c6; background:#fcfaf7; border-radius:6px; }
        .footer { text-align:center; margin-top:50px; font-size:13px; color:#a08f85; border-top:1px solid #e1d6c6; padding-top:20px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: clienteNav}"></div>

<div class="header">
    <h1>PratoFácil</h1>
    <p>Escolha uma loja para fazer seu pedido</p>
</div>

<div class="grid" th:if="${!#lists.isEmpty(lojas)}">
    <a class="loja-card" th:each="l : ${lojas}" th:href="@{'/lojas/' + ${l.id}}">
        <div>
            <img class="loja-logo" th:src="@{'/lojas/' + ${l.id} + '/logo'}" alt="logo" onerror="this.style.display='none'">
            <h2 th:text="${l.nome}">Nome da Loja</h2>
            <p th:text="${l.descricao}">Descrição da loja</p>
        </div>
        <span class="btn">Ver cardápio</span>
    </a>
</div>

<div class="empty" th:if="${#lists.isEmpty(lojas)}">
    Nenhuma loja disponível no momento.
</div>

<div class="footer">
    <p>PratoFácil • O sabor que você procura, perto de você</p>
</div>

</body>
</html>
