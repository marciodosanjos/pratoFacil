# ==========================================================================
# Perfil PROD: banco PostgreSQL hospedado em nuvem (ex.: Neon, Render, Railway).
# As credenciais vem de VARIAVEIS DE AMBIENTE - nunca commite segredos no repo.
#
# Variaveis esperadas (defina-as no servidor/servico de nuvem):
#   SPRING_DATASOURCE_URL       ex.: jdbc:postgresql://HOST:5432/BANCO?sslmode=require
#   SPRING_DATASOURCE_USERNAME  usuario do banco
#   SPRING_DATASOURCE_PASSWORD  senha do banco
#
# E ative este perfil com SPRING_PROFILES_ACTIVE=prod
# ==========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console do H2 desabilitado em producao
spring.h2.console.enabled=false
